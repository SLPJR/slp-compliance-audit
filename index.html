.audit-info { background: var(--white); padding: 16px; margin: 8px; border-radius: 10px; box-shadow: var(--shadow); }
.audit-info h2 { font-size: 15px; color: var(--primary); margin-bottom: 12px; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.info-field label { display: block; font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase; margin-bottom: 4px; }
.info-field input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; transition: border-color 0.2s; }

.score-bar .progress-fill { height: 100%; border-radius: 5px; transition: width 0.4s ease, background 0.4s ease; }
.score-bar .score-pct { font-size: 16px; font-weight: 700; min-width: 52px; text-align: right; }
.score-bar .score-pts { font-size: 11px; color: #888; }

.section-header { padding: 12px 16px; background: #f8f9fa; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

// ===== INDEXED DB FOR PHOTOS =====
const DB_NAME = 'slp_audit_photos';
const DB_VERSION = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (db) return resolve(db);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('photos')) {
        d.createObjectStore('photos', { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}

async function savePhoto(auditKey, itemId, dataUrl) {
  const d = await openDB();
  const key = `${auditKey}_${itemId}`;
  return new Promise((resolve, reject) => {
    const tx = d.transaction('photos', 'readwrite');
    const store = tx.objectStore('photos');
    // Get existing photos for this item
    const getReq = store.get(key);
    getReq.onsuccess = () => {
      const existing = getReq.result || { id: key, auditKey, itemId, photos: [] };
      existing.photos.push(dataUrl);
      store.put(existing);
      tx.oncomplete = () => resolve();
    };
    getReq.onerror = reject;
  });
}

async function getPhotos(auditKey, itemId) {
  const d = await openDB();
  const key = `${auditKey}_${itemId}`;
  return new Promise((resolve) => {
    const tx = d.transaction('photos', 'readonly');
    const store = tx.objectStore('photos');
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result?.photos || []);
    req.onerror = () => resolve([]);
  });
}

async function deletePhoto(auditKey, itemId, photoIdx) {
  const d = await openDB();
  const key = `${auditKey}_${itemId}`;
  return new Promise((resolve) => {
    const tx = d.transaction('photos', 'readwrite');
    const store = tx.objectStore('photos');
    const req = store.get(key);
    req.onsuccess = () => {
      const existing = req.result;
      if (existing) {
        existing.photos.splice(photoIdx, 1);
        if (existing.photos.length === 0) store.delete(key);
        else store.put(existing);
      }
      tx.oncomplete = () => resolve();
    };
  });
}

async function getAllPhotos() {
  const d = await openDB();
  return new Promise((resolve) => {
    const tx = d.transaction('photos', 'readonly');
    const store = tx.objectStore('photos');
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

async function clearAllPhotos() {
  const d = await openDB();
  return new Promise((resolve) => {
    const tx = d.transaction('photos', 'readwrite');
    tx.objectStore('photos').clear();
    tx.oncomplete = () => resolve();
  });
}

// ===== STATE =====
let state = loadState() || { activeTab: 'dashboard', audits: {} };
let pendingPhotoTarget = null;

function initAuditState(auditKey) {
  if (state.audits[auditKey]) return;
  state.audits[auditKey] = { info: { date: '', room: '', inspector: '', teacher1: '', teacher2: '' }, answers: {}, comments: {}, openSections: {} };
}
function loadState() { try { return JSON.parse(localStorage.getItem('slp_audit_state')); } catch(e) { return null; } }
function saveState() { localStorage.setItem('slp_audit_state', JSON.stringify(state)); }

// ===== SCORING =====
function calcSectionScore(auditKey, sectionIdx) {
  const section = AUDITS[auditKey].sections[sectionIdx];
  const answers = state.audits[auditKey]?.answers || {};
  let achieved = 0, max = 0;
  section.items.forEach(item => {
    const ans = answers[item.id];
    if (ans === 'na') return;
    max += item.wt;
    if (ans === 'compliant') achieved += item.wt;
  });
  return { achieved, max, pct: max > 0 ? Math.round((achieved / max) * 1000) / 10 : 0 };
}
function calcAuditTotal(auditKey) {
  let achieved = 0, max = 0;
  AUDITS[auditKey].sections.forEach((_, i) => { const s = calcSectionScore(auditKey, i); achieved += s.achieved; max += s.max; });
  return { achieved, max, pct: max > 0 ? Math.round((achieved / max) * 1000) / 10 : 0 };
}
function getScoreClass(pct) { return pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad'; }
function getScoreColor(pct) { return pct >= 80 ? '#27ae60' : pct >= 50 ? '#f39c12' : '#e74c3c'; }

// ===== CAMERA =====
const cameraInput = document.getElementById('cameraInput');
cameraInput.addEventListener('change', async (e) => {
  if (!e.target.files.length || !pendingPhotoTarget) return;
  const file = e.target.files[0];
  const dataUrl = await resizeImage(file, 1200);
  await savePhoto(pendingPhotoTarget.auditKey, pendingPhotoTarget.itemId, dataUrl);
  e.target.value = '';
  await renderPhotoThumbs(pendingPhotoTarget.auditKey, pendingPhotoTarget.itemId);
  showToast('Photo saved!');
});

function resizeImage(file, maxDim) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function triggerCamera(auditKey, itemId) {
  pendingPhotoTarget = { auditKey, itemId };
  cameraInput.click();
}

async function renderPhotoThumbs(auditKey, itemId) {
  const container = document.getElementById(`photos_${auditKey}_${itemId}`);
  if (!container) return;
  const photos = await getPhotos(auditKey, itemId);
  if (photos.length === 0) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = photos.map((p, i) =>
    `<div class="photo-thumb">
      <img src="${p}" onclick="viewPhoto('${auditKey}','${itemId}',${i})">
      <button class="photo-delete" onclick="removePhoto('${auditKey}','${itemId}',${i})">x</button>
    </div>`
  ).join('') + `<span class="photo-count">${photos.length} photo${photos.length > 1 ? 's' : ''}</span>`;
}

async function removePhoto(auditKey, itemId, idx) {
  await deletePhoto(auditKey, itemId, idx);
  await renderPhotoThumbs(auditKey, itemId);
}

async function viewPhoto(auditKey, itemId, idx) {
  const photos = await getPhotos(auditKey, itemId);
  if (!photos[idx]) return;
  document.getElementById('photoModal').innerHTML =
    `<div class="photo-modal" onclick="this.remove()">
      <button class="photo-modal-close" onclick="this.parentElement.remove()">&times;</button>
      <img src="${photos[idx]}">
    </div>`;
}

// ===== RENDER =====
async function render() {
  const content = document.getElementById('content');
  if (state.activeTab === 'dashboard') {
    content.innerHTML = renderDashboard();
  } else {
    content.innerHTML = renderAudit(state.activeTab);
    // Load photo thumbnails
    const auditKey = state.activeTab;
    for (const section of AUDITS[auditKey].sections) {
      for (const item of section.items) {
        await renderPhotoThumbs(auditKey, item.id);
      }
    }
  }
  bindEvents();
  saveState();
}

function renderDashboard() {
  let html = '<div class="dashboard">';
  html += `<div class="audit-info" style="margin-bottom:10px">
    <div style="font-size:12px;color:#666;line-height:1.6">
      <strong>Weight Guide:</strong><br>
      <span class="item-weight wt-1">1</span> Standard (Low penalty risk $50-$1,000) &nbsp;
      <span class="item-weight wt-2">2</span> Important (Medium risk $250-$4,000) &nbsp;
      <span class="item-weight wt-3">3</span> Critical (High risk $500-$10,000)
    </div>
  </div>`;

  const auditMeta = [
    { key: 'licensing', label: 'Childcare Licensing', cls: 'licensing' },
    { key: 'ahs', label: 'Alberta Health (AHS)', cls: 'ahs' },
    { key: 'kitchen', label: 'Kitchen', cls: 'kitchen' },
    { key: 'pedagogy', label: 'Prog. & Pedagogy', cls: 'pedagogy' }
  ];

  auditMeta.forEach(m => {

      html += `<div class="dash-section-row"><span class="dash-section-name">${sec.name}</span><span class="dash-section-score" style="color:${getScoreColor(s.pct)}">${s.achieved}/${s.max} (${s.pct}%)</span></div>`;
    });
    html += `<div class="dash-total"><span>${m.label} - TOTAL</span><span style="color:${getScoreColor(total.pct)}">${total.achieved}/${total.max} (${total.pct}%)</span></div></div>`;
  });

  html += `<div class="export-section">
    <button class="export-btn excel" onclick="exportToZip()" id="exportBtn">Export to ZIP (Excel + Photos)</button>
    <button class="export-btn save" onclick="saveProgress()">Save Progress Locally</button>
    <button class="export-btn clear" onclick="clearAll()">Clear All Data</button>
  </div></div>`;
  return html;
}

  initAuditState(auditKey);
  const audit = AUDITS[auditKey];
  const auditState = state.audits[auditKey];
  const total = calcAuditTotal(auditKey);
  const camSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;

  let html = `<div class="audit-info">
    <h2>${audit.title}</h2>
    <div class="info-grid">
      <div class="info-field"><label>Date</label><input type="date" data-info="date" value="${auditState.info.date}"></div>
      <div class="info-field"><label>Room / Classroom</label><input type="text" data-info="room" value="${auditState.info.room}" placeholder="e.g., Butterfly Room"></div>
    </div>
    <div class="info-grid" style="margin-top:10px">
      <div class="info-field"><label>Inspector</label><input type="text" data-info="inspector" value="${auditState.info.inspector}" placeholder="Name"></div>
      <div class="info-field"><label>Teacher 1</label><input type="text" data-info="teacher1" value="${auditState.info.teacher1}" placeholder="Name"></div>
    </div>
    <div class="info-grid single" style="margin-top:10px">
      <div class="info-field"><label>Teacher 2</label><input type="text" data-info="teacher2" value="${auditState.info.teacher2}" placeholder="Name"></div>
    </div>
  </div>`;

  html += `<div class="score-bar">
    <span class="score-label">OVERALL</span>
    <div class="progress-track"><div class="progress-fill" style="width:${total.pct}%;background:${getScoreColor(total.pct)}"></div></div>
    <div><div class="score-pct" style="color:${getScoreColor(total.pct)}">${total.pct}%</div><div class="score-pts">${total.achieved}/${total.max}</div></div>
  </div>`;

  audit.sections.forEach((section, si) => {
    const score = calcSectionScore(auditKey, si);
    const isOpen = auditState.openSections[si];
    html += `<div class="section-card"><div class="section-header" data-toggle-section="${si}">
      <h3>${section.name}</h3>
      <span class="section-score ${getScoreClass(score.pct)}">${score.achieved}/${score.max} (${score.pct}%)</span>
    </div><div class="section-items ${isOpen ? 'open' : ''}">`;

    section.items.forEach(item => {
      const ans = auditState.answers[item.id] || '';
      const comment = auditState.comments[item.id] || '';
      html += `<div class="item">
        <div class="item-header">
          <span class="item-num">${item.id}</span>
          <span class="item-text">${item.text}</span>
          <span class="item-weight wt-${item.wt}">${item.wt}</span>
        </div>
        <div class="answer-row">
          <button class="answer-btn compliant ${ans === 'compliant' ? 'selected' : ''}" data-item="${item.id}" data-answer="compliant">Compliant</button>
          <button class="answer-btn non-compliant ${ans === 'non-compliant' ? 'selected' : ''}" data-item="${item.id}" data-answer="non-compliant">Non-Compliant</button>
          <button class="answer-btn na ${ans === 'na' ? 'selected' : ''}" data-item="${item.id}" data-answer="na">N/A</button>
        </div>
        <div class="photo-row">
          <button class="photo-btn" onclick="triggerCamera('${auditKey}','${item.id}')">${camSvg} Photo</button>
          <div class="photo-thumbs" id="photos_${auditKey}_${item.id}"></div>
        </div>
        <textarea class="comment-input" data-comment="${item.id}" placeholder="Comments / Action Required">${comment}</textarea>
      </div>`;
    });
    html += '</div></div>';

  return html;
}

function bindEvents() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.activeTab = btn.dataset.tab;
      render();
    };
  });
  if (state.activeTab === 'dashboard') return;
  const auditKey = state.activeTab;
  const auditState = state.audits[auditKey];

  document.querySelectorAll('[data-info]').forEach(input => {
    input.addEventListener('change', () => { auditState.info[input.dataset.info] = input.value; saveState(); });
  });
  document.querySelectorAll('[data-toggle-section]').forEach(el => {
    el.onclick = () => {
      const si = el.dataset.toggleSection;
      auditState.openSections[si] = !auditState.openSections[si];
      el.nextElementSibling.classList.toggle('open');
      saveState();
    };
  });
  document.querySelectorAll('.answer-btn').forEach(btn => {
    btn.onclick = () => {
      const itemId = btn.dataset.item;
      const answer = btn.dataset.answer;
      if (auditState.answers[itemId] === answer) delete auditState.answers[itemId];
      else auditState.answers[itemId] = answer;
      saveState();
      render();
    };
  });
  document.querySelectorAll('[data-comment]').forEach(textarea => {
    textarea.addEventListener('input', () => { auditState.comments[textarea.dataset.comment] = textarea.value; saveState(); });
  });
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function saveProgress() { saveState(); showToast('Progress saved!'); }
async function clearAll() {
  if (confirm('Are you sure you want to clear ALL audit data and photos? This cannot be undone.')) {
    state = { activeTab: 'dashboard', audits: {} };
    saveState();
    await clearAllPhotos();
    render();
    showToast('All data cleared');
  }
}

// ===== AUDIT LABELS FOR FILE NAMING =====
const AUDIT_LABELS = { licensing: 'Licensing', ahs: 'AHS', kitchen: 'Kitchen', pedagogy: 'Pedagogy' };

// ===== ZIP EXPORT (Excel + Photos) =====
async function exportToZip() {
  const btn = document.getElementById('exportBtn');
  btn.disabled = true;
  btn.textContent = 'Preparing export...';

  try {
    const zip = new JSZip();
    const compliantFolder = zip.folder('Compliant_Photos');
    const nonCompliantFolder = zip.folder('Non_Compliant_Photos');

    // Build Excel
    const wb = XLSX.utils.book_new();

    // Summary Dashboard sheet
    const dashData = [['Smart Little People  |  Compliance Audit Dashboard'],[],[null,'AUDIT SCORE SUMMARY'],[null,'Audit Type','Section','Achieved','Max','Score %']];
    const auditMeta = [
      { key: 'licensing', label: 'Childcare Licensing' },
      { key: 'ahs', label: 'Alberta Health (AHS)' },
      { key: 'kitchen', label: 'Kitchen' },
      { key: 'pedagogy', label: 'Prog. & Pedagogy' }
    ];
    auditMeta.forEach(m => {
      initAuditState(m.key);
      let first = true;
      AUDITS[m.key].sections.forEach((sec, i) => {
        const s = calcSectionScore(m.key, i);
        dashData.push([null, first ? m.label : null, sec.name, s.achieved, s.max, s.pct / 100]);
        first = false;
      });
      const total = calcAuditTotal(m.key);
      dashData.push([null, m.label + '  - TOTAL', null, total.achieved, total.max, total.pct / 100]);
      dashData.push([]);
    });
    const dashWs = XLSX.utils.aoa_to_sheet(dashData);
    dashWs['!cols'] = [{wch:4},{wch:24},{wch:38},{wch:10},{wch:8},{wch:10}];
    for (let r = 0; r < dashData.length; r++) { const cell = dashWs[XLSX.utils.encode_cell({r,c:5})]; if (cell && typeof cell.v === 'number') cell.z = '0.0%'; }
    XLSX.utils.book_append_sheet(wb, dashWs, 'Summary Dashboard');

    // Each audit sheet
    const sheetNames = { licensing: 'Childcare Licensing', ahs: 'AHS Audit', kitchen: 'Kitchen Audit', pedagogy: 'Programming & Pedagogy' };
    Object.keys(AUDITS).forEach(auditKey => {
      initAuditState(auditKey);
      const audit = AUDITS[auditKey];
      const auditState = state.audits[auditKey];
      const info = auditState.info;
      const data = [];
      data.push([`Smart Little People  |  ${audit.title}`]);
      data.push(['Date:', info.date, null, null, 'Room / Classroom:', info.room]);
      data.push(['Inspector:', info.inspector, null, null, 'Teacher 1:', info.teacher1]);
      data.push(['Teacher 2:', info.teacher2]);
      data.push(['Weight:  1 = Standard  |  2 = Important ($250-$4,000)  |  3 = Critical ($500-$10,000)']);
      data.push(['#', 'Compliance Area', 'Wt', 'Answer', 'Pts', 'Max', 'Comments / Action Required']);
      audit.sections.forEach((section, si) => {
        data.push([`Section ${section.name}`]);
        section.items.forEach(item => {
          const ans = auditState.answers[item.id] || '';
          let answerText = '', pts = 0, max = item.wt;
          if (ans === 'compliant') { answerText = 'Compliant'; pts = item.wt; }
          else if (ans === 'non-compliant') { answerText = 'Non-Compliant'; pts = 0; }
          else if (ans === 'na') { answerText = 'N/A'; pts = 0; max = 0; }
          data.push([item.id, item.text, item.wt, answerText, pts, max, auditState.comments[item.id] || '']);
        });
        const score = calcSectionScore(auditKey, si);
        data.push(['Section Score', null, null, null, score.achieved, score.max, score.pct / 100]);
        data.push([]);
      });
      const total = calcAuditTotal(auditKey);
      data.push(['OVERALL AUDIT SCORE', null, null, null, total.achieved, total.max, total.pct / 100]);
      const ws = XLSX.utils.aoa_to_sheet(data);
      ws['!cols'] = [{wch:12},{wch:65},{wch:5},{wch:16},{wch:6},{wch:6},{wch:40}];
      for (let r = 0; r < data.length; r++) { const cell = ws[XLSX.utils.encode_cell({r,c:6})]; if (cell && typeof cell.v === 'number') cell.z = '0.0%'; }
      XLSX.utils.book_append_sheet(wb, ws, sheetNames[auditKey]);
    });

    const xlsxData = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
    const room = state.audits.licensing?.info?.room || 'Audit';
    const safeName = room.replace(/[^a-zA-Z0-9]/g, '_') || 'Audit';
    zip.file(`SLP_Compliance_${safeName}_${today}.xlsx`, xlsxData);

    // Add photos to folders
    const allPhotos = await getAllPhotos();
    let photoCount = 0;
    for (const entry of allPhotos) {
      const auditKey = entry.auditKey;
      const itemId = entry.itemId;
      const answer = state.audits[auditKey]?.answers[itemId];
      const folder = answer === 'compliant' ? compliantFolder : nonCompliantFolder;
      const auditLabel = AUDIT_LABELS[auditKey] || auditKey;
      const safeItemId = itemId.replace(/\./g, '-');

      for (let i = 0; i < entry.photos.length; i++) {
        const dataUrl = entry.photos[i];
        const base64 = dataUrl.split(',')[1];
        const suffix = entry.photos.length > 1 ? `_${i + 1}` : '';
        const filename = `${auditLabel}_${safeItemId}${suffix}.jpg`;
        folder.file(filename, base64, { base64: true });
        photoCount++;
      }
    }

    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `SLP_Compliance_${safeName}_${today}.zip`;
    a.click();
    URL.revokeObjectURL(url);

    showToast(`Exported! ${photoCount} photo${photoCount !== 1 ? 's' : ''} included`);
  } catch(err) {
    console.error(err);
    showToast('Export error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Export to ZIP (Excel + Photos)';
  }
}

// ===== INIT =====
openDB().then(() => render());
</script>
